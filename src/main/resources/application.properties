spring.mvc.pathmatch.matching-strategy=ant_path_matcher

#Profiles: identity, undersampling, redundancy
spring.profiles.active=undersampling

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.datasource.url=jdbc:postgresql://postgres-db:5432/blueprintsdb
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always